<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  width="64"
  height="64"
  fill="none"
  role="img"
  aria-label="ZEVQORA"
>
  <title>ZEVQORA</title>
  <!--
    The mark fuses Z and Q with connected execution nodes and trace paths.
    Reconstructed as vector from zevqora_brand_mark/screen.png.
    Strokes are round-joined so the form stays legible down to 16px.
  -->
  <g
    stroke="#bff440"
    stroke-width="3.25"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <!-- Q: the counter-circle the trace passes through -->
    <circle cx="42" cy="32" r="14.5" opacity="0.9" />
    <!-- Q counter arc -->
    <path d="M31.5 41.5a14.5 14.5 0 0 1 2.6-17.2" opacity="0.55" />
    <!-- Z: top bar, diagonal, bottom bar -->
    <path d="M16 16.5h23.5L18.5 47.5H40" />
    <!-- Trace path: rises to the apex node, descends to the terminal node -->
    <path d="M24.5 35.5 43 25.5l11 20" />
  </g>
  <!-- Execution nodes -->
  <g fill="#bff440">
    <circle cx="16" cy="16.5" r="3.6" />
    <circle cx="24.5" cy="35.5" r="3.6" />
    <circle cx="43" cy="25.5" r="3.6" />
    <circle cx="54" cy="45.5" r="3.6" />
  </g>
</svg>
